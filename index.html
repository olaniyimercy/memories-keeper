<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Gallery Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="gallery-header">
        <h1>My Gallery</h1>
        <p>A private, persistent space for your memories</p>
    </header>

    <main class="gallery-container">
        <div class="empty-state" id="emptyState">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <h3>Your gallery is empty</h3>
            <p>Click the button below to add your first photo or video.</p>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>

        <div class="loading-spinner hidden" id="loadingSpinner">
            <div class="spinner"></div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" title="Close view">&times;</button>
        <div class="lightbox-content" id="lightboxContent"></div>
        <div class="lightbox-meta">
            <h2 id="lightboxTitle"></h2>
            <p id="lightboxLocation"></p>
        </div>
    </div>

    <label for="mediaUpload" class="upload-fab" title="Upload Media File">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </label>
    <input type="file" id="mediaUpload" accept="image/*,video/*" multiple style="display: none;">

    <script src="script.js"></script>
</body>

</html>
